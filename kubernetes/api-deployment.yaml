apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsatlas-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newsatlas-api
  template:
    metadata:
      labels:
        app: newsatlas-api
    spec:
      containers:
        - name: api
          image: newsatlas-api:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
