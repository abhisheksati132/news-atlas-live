apiVersion: v1
kind: Service
metadata:
  name: newsatlas-api
spec:
  selector:
    app: newsatlas-api
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: newsatlas-frontend
spec:
  selector:
    app: newsatlas-frontend
  ports:
    - protocol: TCP
      port: 5173
      targetPort: 5173
  type: ClusterIP
